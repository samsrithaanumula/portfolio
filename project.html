<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Projects</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    }

    body {
      font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
      background-color: #f8f9fa;
    }

    nav {
      background-color: #2c3e50;
    }

    .navbar-brand {
      color: white;
      font-size: 30px;
      font-family: cursive;
    }

    .navbar-nav .nav-link {
      color: white ;
      font-size: 27px;
      align-items:center;
    }

    .nav-link:hover {
      text-decoration: underline;
    }



    h1 {
      text-align: center;
      margin-top: 20px;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }

    .project-box {
      background-color: white;
      border: 2px solid #444;
      border-radius: 10px;
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: bold;
      transition: transform 0.3s ease;
      opacity: 0;
      animation: slideUp 0.6s ease forwards;
      max-width: 100%;
      overflow: hidden; /* Prevent overflow */
      box-sizing: border-box;
    }

    .project-box:hover {
      transform: scale(1.05);
      background-color: #2c3e50;
      color: white;
    }

    @keyframes slideUp {
      from {
        transform: translateY(30px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .project-box:nth-child(1) { animation-delay: 0.2s; }
    .project-box:nth-child(2) { animation-delay: 0.4s; }
    .project-box:nth-child(3) { animation-delay: 0.6s; }
    .project-box:nth-child(4) { animation-delay: 0.8s; }
    .project-box:nth-child(5) { animation-delay: 1s; }

    a {
      text-decoration: none;
      color: inherit;
      
    }

    @media (max-width: 768px) {
      .navbar-nav .nav-link {
        font-size: 18px;
      }

      .grid-container {
        padding: 10px;
      }
    }
    .project-box{
      display: flex;
      flex-direction: column;
      align-items:center;
    }
  </style>
</head>
<body>

          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
          <ul class="navbar-nav">

            <li class="nav-item"><a class="nav-link" href="./about.html">About</a></li>

            <li class="nav-item"><a class="nav-link" href="./contact.html">Contact</a></li>
          </ul>
        </div>
      </div>
    </nav>
